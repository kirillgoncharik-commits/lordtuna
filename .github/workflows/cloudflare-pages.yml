name: Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 758b5c11ba55bb23d1b3ec748d0a894a
  CLOUDFLARE_PAGES_PROJECT: lordtuna

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Lord Tuna

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stage public site
        run: |
          mkdir -p /tmp/lordtuna-public
          rsync -a             --exclude='.git'             --exclude='.github'             --exclude='docs'             --exclude='README.md'             ./ /tmp/lordtuna-public/

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages project create ${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy /tmp/lordtuna-public
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment URL
        run: |
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
